<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostRadar | Kişisel Panom 📌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .hero-gradient {
            background: radial-gradient(circle at top right, #1e293b, #0b1120);
        }

        /* Sürükle Bırak Animasyonları */
        .kanban-col {
            min-height: 400px;
            transition: background-color 0.2s;
        }

        .drag-over {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
            border-style: dashed;
        }

        .kanban-card {
            cursor: grab;
            transition: transform 0.2s;
        }

        .kanban-card:active {
            cursor: grabbing;
            transform: scale(0.98);
        }

        /* Yaklaşan Mülakat Alarmı */
        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(244, 63, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0);
            }
        }

        .urgent-card {
            animation: pulse-border 2s infinite;
            border-color: #f43f5e !important;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen relative hero-gradient flex flex-col select-none">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-8">
                <a href="/" class="hover:scale-105 transition-transform block">
                    <h1 class="text-2xl font-black text-sky-400 tracking-tighter"
                        style="text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);">GHOSTRADAR 🕵️‍♂️</h1>
                </a>
                <div class="hidden md:flex gap-6 text-sm font-bold text-slate-400">
                    <a href="/" class="hover:text-white transition">Radar Haritası</a>
                    <a href="/siralamalar" class="hover:text-white transition">Sıralamalar</a>
                    <a href="/karsilastir" class="hover:text-white transition">Karşılaştır</a>
                    <a href="/panom" class="text-white border-b-2 border-fuchsia-500 pb-1">Panom 📌</a>
                </div>
            </div>
            <button onclick="openBoardModal()"
                class="bg-gradient-to-r from-fuchsia-600 to-purple-600 hover:from-fuchsia-500 hover:to-purple-500 text-white font-bold py-2 px-6 rounded-lg transition text-sm shadow-[0_0_15px_rgba(192,38,211,0.4)]">Başvuru
                Ekle +</button>
        </div>
    </nav>

    <!-- Header -->
    <div class="px-6 py-8">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-black text-white mb-2">📌 Kişisel Savaş Panon</h2>
            <p class="text-slate-400 text-sm">Başvurularını takip et, mülakat tarihlerini kaçırma. <span
                    class="text-fuchsia-400 font-bold">(Veriler sadece senin cihazında tutulur)</span></p>
        </div>
    </div>

    <!-- Kanban Board -->
    <main class="flex-1 overflow-x-auto pb-12 px-6">
        <div class="flex gap-6 min-w-max h-full" id="board-container">

            <!-- Sütun 1: Başvuruldu -->
            <div class="w-80 flex flex-col bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden">
                <div class="p-4 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-slate-300 text-sm">📝 Başvuruldu</h3>
                    <span class="bg-slate-700 text-xs px-2 py-0.5 rounded-full" id="count-col-1">0</span>
                </div>
                <div class="kanban-col p-4 flex-1 space-y-4" id="col-1" ondrop="drop(event)"
                    ondragover="allowDrop(event)"></div>
            </div>

            <!-- Sütun 2: Değerlendirmede / Sınav -->
            <div class="w-80 flex flex-col bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden">
                <div class="p-4 bg-slate-800/80 border-b border-sky-500/30 flex justify-between items-center">
                    <h3 class="font-bold text-sky-400 text-sm">⚙️ Sınav / Case</h3>
                    <span class="bg-slate-700 text-xs px-2 py-0.5 rounded-full" id="count-col-2">0</span>
                </div>
                <div class="kanban-col p-4 flex-1 space-y-4" id="col-2" ondrop="drop(event)"
                    ondragover="allowDrop(event)"></div>
            </div>

            <!-- Sütun 3: Mülakat Bekleniyor -->
            <div class="w-80 flex flex-col bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden">
                <div class="p-4 bg-slate-800/80 border-b border-amber-500/30 flex justify-between items-center">
                    <h3 class="font-bold text-amber-400 text-sm">⏳ Mülakat</h3>
                    <span class="bg-slate-700 text-xs px-2 py-0.5 rounded-full" id="count-col-3">0</span>
                </div>
                <div class="kanban-col p-4 flex-1 space-y-4" id="col-3" ondrop="drop(event)"
                    ondragover="allowDrop(event)"></div>
            </div>

            <!-- Sütun 4: Olumlu / Teklif -->
            <div class="w-80 flex flex-col bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden">
                <div class="p-4 bg-slate-800/80 border-b border-emerald-500/30 flex justify-between items-center">
                    <h3 class="font-bold text-emerald-400 text-sm">🎉 Teklif Aldım</h3>
                    <span class="bg-slate-700 text-xs px-2 py-0.5 rounded-full" id="count-col-4">0</span>
                </div>
                <div class="kanban-col p-4 flex-1 space-y-4" id="col-4" ondrop="drop(event)"
                    ondragover="allowDrop(event)"></div>
            </div>

            <!-- Sütun 5: Elendi / Ghostlandı -->
            <div
                class="w-80 flex flex-col bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden opacity-70">
                <div class="p-4 bg-slate-800/80 border-b border-rose-500/30 flex justify-between items-center">
                    <h3 class="font-bold text-rose-400 text-sm">👻 Elendi / Ghost</h3>
                    <span class="bg-slate-700 text-xs px-2 py-0.5 rounded-full" id="count-col-5">0</span>
                </div>
                <div class="kanban-col p-4 flex-1 space-y-4" id="col-5" ondrop="drop(event)"
                    ondragover="allowDrop(event)"></div>
            </div>

        </div>
    </main>

    <!-- Kart Ekleme Modalı -->
    <div id="boardModal"
        class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-fuchsia-500/50 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6">Yeni Başvuru Kartı</h2>
            <form id="board-form" class="space-y-4">
                <input type="text" id="card-company" placeholder="Şirket Adı (Örn: ING Hubs)"
                    class="w-full bg-slate-900 border border-slate-700 text-sm rounded-xl p-3 text-white" required>
                <input type="text" id="card-role" placeholder="Pozisyon (Örn: Data Analyst)"
                    class="w-full bg-slate-900 border border-slate-700 text-sm rounded-xl p-3 text-white" required>

                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                    <label class="block text-xs text-slate-400 mb-1">Mülakat / Son Tarih (Opsiyonel)</label>
                    <input type="datetime-local" id="card-date"
                        class="w-full bg-transparent border-none text-sm text-white focus:outline-none">
                </div>

                <textarea id="card-notes"
                    placeholder="Özel Notlar (Örn: SQL çalışılacak, İK Zehra Hanım ile görüşülecek...)"
                    class="w-full bg-slate-900 border border-slate-700 text-sm rounded-xl p-3 h-20 text-white"></textarea>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeBoardModal()"
                        class="w-1/3 bg-slate-700 text-white font-bold py-3 rounded-xl text-sm hover:bg-slate-600 transition">İptal</button>
                    <button type="submit"
                        class="w-2/3 bg-fuchsia-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-fuchsia-500 transition shadow-lg">Pano'ya
                        Ekle 📌</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- KANBAN SİSTEMİ & LOCALSTORAGE ---
        let tasks = JSON.parse(localStorage.getItem('ghostRadarTasks')) || [];

        function saveTasks() {
            localStorage.setItem('ghostRadarTasks', JSON.stringify(tasks));
        }

        function renderBoard() {
            // Sütunları temizle
            document.querySelectorAll('.kanban-col').forEach(col => col.innerHTML = '');
            const counts = { 'col-1': 0, 'col-2': 0, 'col-3': 0, 'col-4': 0, 'col-5': 0 };

            tasks.forEach(task => {
                const col = document.getElementById(task.status);
                if (!col) return;

                counts[task.status]++;

                // Tarih ve Alarm Kontrolü
                let dateHtml = '';
                let isUrgent = false;

                if (task.date) {
                    const taskDate = new Date(task.date);
                    const now = new Date();
                    const diffHours = (taskDate - now) / (1000 * 60 * 60);

                    const dateString = taskDate.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

                    // 48 saatten az kaldıysa kırmızı alarm
                    if (diffHours > 0 && diffHours < 48) {
                        isUrgent = true;
                        dateHtml = `<div class="mt-3 text-[10px] font-bold text-rose-400 bg-rose-500/10 inline-block px-2 py-1 rounded border border-rose-500/20">🚨 Mülakat Yaklaşıyor: ${dateString}</div>`;
                    }
                    // Süre geçtiyse gri
                    else if (diffHours <= 0) {
                        dateHtml = `<div class="mt-3 text-[10px] text-slate-500 bg-slate-800 inline-block px-2 py-1 rounded">Geçmiş: ${dateString}</div>`;
                    }
                    // Normal tarih
                    else {
                        dateHtml = `<div class="mt-3 text-[10px] text-sky-400 bg-sky-500/10 inline-block px-2 py-1 rounded">📅 ${dateString}</div>`;
                    }
                }

                const cardHTML = `
                    <div class="kanban-card bg-slate-800 border ${isUrgent ? 'urgent-card' : 'border-slate-700'} p-4 rounded-xl shadow-lg relative group" 
                         draggable="true" ondragstart="drag(event)" id="task-${task.id}">
                        <button onclick="deleteTask(${task.id})" class="absolute top-2 right-2 text-slate-500 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition">✖</button>
                        <h4 class="font-black text-white text-sm mb-1">${task.company}</h4>
                        <p class="text-xs text-slate-400">${task.role}</p>
                        ${task.notes ? `<p class="mt-2 text-[10px] text-slate-500 italic bg-slate-900/50 p-2 rounded border border-slate-700/50">${task.notes}</p>` : ''}
                        ${dateHtml}
                    </div>
                `;
                col.innerHTML += cardHTML;
            });

            // Sayaçları güncelle
            for (let key in counts) {
                document.getElementById(`count-${key}`).innerText = counts[key];
            }
        }

        // --- SÜRÜKLE BIRAK (DRAG & DROP) ---
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function drag(ev) {
            ev.dataTransfer.setData("taskId", ev.target.id.split('-')[1]);
        }

        function drop(ev) {
            ev.preventDefault();
            const cols = document.querySelectorAll('.kanban-col');
            cols.forEach(c => c.classList.remove('drag-over'));

            const taskId = ev.dataTransfer.getData("taskId");
            const newStatus = ev.currentTarget.id; // col-1, col-2 vs.

            // Task'ı bul ve durumunu güncelle
            const taskIndex = tasks.findIndex(t => t.id == taskId);
            if (taskIndex > -1) {
                tasks[taskIndex].status = newStatus;
                saveTasks();
                renderBoard();
            }
        }

        // Drag bitişinde highlight'ı temizle (Görsel hata düzeltmesi)
        document.addEventListener('dragend', function () {
            document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
        });

        // --- FORM İŞLEMLERİ ---
        const boardModal = document.getElementById('boardModal');
        function openBoardModal() { boardModal.classList.remove('hidden'); }
        function closeBoardModal() { boardModal.classList.add('hidden'); document.getElementById('board-form').reset(); }

        document.getElementById('board-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const newTask = {
                id: Date.now(), // Benzersiz ID
                company: document.getElementById('card-company').value,
                role: document.getElementById('card-role').value,
                date: document.getElementById('card-date').value,
                notes: document.getElementById('card-notes').value,
                status: 'col-1' // Varsayılan olarak "Başvuruldu" sütununa atar
            };

            tasks.push(newTask);
            saveTasks();
            closeBoardModal();
            renderBoard();
        });

        function deleteTask(id) {
            if (confirm("Bu kaydı silmek istediğine emin misin?")) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderBoard();
            }
        }

        // İlk Yükleme
        renderBoard();
    </script>
</body>

</html>
