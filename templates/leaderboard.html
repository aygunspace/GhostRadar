<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostRadar | Şirket Sıralamaları</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 select-none">
    <div class="max-w-4xl mx-auto">
        <a href="/" class="text-slate-400 hover:text-sky-400 transition mb-8 inline-block flex items-center gap-2">
            <span>←</span> Ana Radara Dön
        </a>

        <div class="text-center mb-12">
            <h1 class="text-5xl font-black text-white mb-4">🏆 Liderlik ve Şeffaflık Tablosu</h1>
            <p class="text-slate-400 text-lg">Hangi şirket adaylara daha hızlı dönüyor? Kim daha çok
                "Ghostluyor"?<br>Veriler kullanıcı bildirimlerine göre anlık olarak hesaplanır.</p>
        </div>

        <div id="leaderboard-list" class="space-y-4">
            <div class="text-center text-slate-500 py-10">Sıralamalar Hesaplanıyor...</div>
        </div>
    </div>

    <script>
        fetch('/api/leaderboard')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';

                if (data.length === 0) {
                    list.innerHTML = '<div class="text-center text-slate-500">Henüz yeterli veri yok.</div>';
                    return;
                }

                data.forEach((item, index) => {
                    const colorClass = item.ghost_rate > 50 ? 'text-rose-500' : 'text-emerald-400';
                    let badge = '';

                    if (index === 0 && item.ghost_rate > 50) badge = '👻 <span class="text-xs text-rose-500 bg-rose-500/10 px-2 py-1 rounded ml-2">Ghosting Şampiyonu</span>';
                    if (index === data.length - 1 && item.ghost_rate === 0) badge = '✨ <span class="text-xs text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded ml-2">Aday Dostu</span>';

                    // YENİ: Liderlik Tablosu Mavi Tik Mantığı
                    let verifiedIcon = '';
                    if (item.total_apps >= 2 && item.ghost_rate <= 25) {
                        verifiedIcon = '<span title="Aday Dostu Şirket" class="inline-flex items-center justify-center w-5 h-5 bg-blue-500 text-white rounded-full ml-2 shadow-[0_0_10px_rgba(59,130,246,0.6)]"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>';
                    }

                    list.innerHTML += `
                        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center shadow-lg hover:border-slate-500 transition">
                            <div class="flex items-center gap-6 mb-4 md:mb-0 w-full md:w-auto">
                                <span class="text-3xl font-black text-slate-600 w-8 text-center">#${index + 1}</span>
                                <div>
                                    <h3 class="text-2xl font-bold text-white flex items-center"><a href="/sirket/${encodeURIComponent(item.company_name)}" class="hover:text-sky-400 transition">${item.company_name}</a> ${verifiedIcon}</h3>
                                    <p class="text-slate-400 text-sm mt-2 flex items-center">${item.total_apps} Süreç Bildirimi ${badge}</p>
                                </div>
                            </div>
                            <div class="text-center md:text-right w-full md:w-auto bg-slate-900 md:bg-transparent p-4 md:p-0 rounded-xl">
                                <p class="text-xs uppercase text-slate-500 font-bold tracking-widest mb-1">Ghosting Oranı</p>
                                <p class="text-4xl font-black ${colorClass}">%${Math.round(item.ghost_rate)}</p>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => console.error("Sıralama çekilemedi:", err));
    </script>
</body>

</html>
